// ─── STATE ──────────────────────────────────────────────────────────────────
let currentModule = 0;
let currentLesson = 0;
let completedLessons = new Set();
let score = 0;
let totalQuestions = 0;

// ─── INIT ────────────────────────────────────────────────────────────────────
function init() {
  loadProgress();
  buildNav();
  renderLesson();
}

function buildNav() {
  const nav = document.getElementById('nav-container');
  nav.innerHTML = '';
  MODULES.forEach((mod, mi) => {
    const sec = document.createElement('div');
    sec.className = 'nav-section';
    sec.textContent = mod.icon + ' ' + mod.title;
    nav.appendChild(sec);
    mod.lessons.forEach((les, li) => {
      const key = `${mi}-${li}`;
      const item = document.createElement('div');
      item.className = 'nav-item' + (completedLessons.has(key) ? ' done' : '') + (mi === currentModule && li === currentLesson ? ' active' : '');
      item.innerHTML = `<span class="dot"></span>${les.title}`;
      item.onclick = () => { currentModule = mi; currentLesson = li; renderLesson(); buildNav(); saveProgress(); };
      nav.appendChild(item);
    });
  });
}

function renderLesson() {
  const mod = MODULES[currentModule];
  const les = mod.lessons[currentLesson];
  document.getElementById('topbar-title').textContent = mod.title + ' — ' + les.title;
  updateProgress();
  const content = document.getElementById('content');
  content.innerHTML = '';
  if (les.type === 'lesson') renderLessonContent(les, content);
  else if (les.type === 'practice') renderPractice(les, content);
  else if (les.type === 'quiz') renderQuiz(les, content);
}

function updateProgress() {
  let total = 0, done = completedLessons.size;
  MODULES.forEach(m => total += m.lessons.length);
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${done} / ${total} tamamlandı`;
}

// ─── LESSON ──────────────────────────────────────────────────────────────────
function renderLessonContent(les, container) {
  const div = document.createElement('div');
  div.innerHTML = les.content;
  const nav = document.createElement('div');
  nav.style.cssText = 'display:flex;justify-content:flex-end;margin-top:20px;';
  const btn = document.createElement('button');
  btn.className = 'btn btn-next';
  btn.textContent = 'Sonraki →';
  btn.onclick = nextLesson;
  nav.appendChild(btn);
  div.appendChild(nav);
  container.appendChild(div);
  markDone();
}

// ─── PRACTICE ────────────────────────────────────────────────────────────────
let practiceIdx = 0;
function renderPractice(les, container) {
  practiceIdx = 0;
  renderPracticeQ(les, container);
}

function renderPracticeQ(les, container) {
  container.innerHTML = '';
  const q = les.questions[practiceIdx];
  const total = les.questions.length;

  const header = document.createElement('div');
  header.className = 'section-title';
  header.innerHTML = `✍️ Yazarak Öğren <span class="badge badge-blue">${practiceIdx+1} / ${total}</span>`;
  container.appendChild(header);

  const area = document.createElement('div');
  area.className = 'practice-area';
  area.innerHTML = `
    <div class="practice-header">
      <span>SQL Alıştırması</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-hint" onclick="toggleSchema()">📋 Tablolar</button>
        <button class="btn btn-hint" onclick="showHint()">💡 İpucu</button>
      </div>
    </div>
    <div id="practice-schema" style="display:none; padding:16px; background:var(--surface2); border-bottom:1px solid var(--border)">
      <div style="font-size:0.8rem; font-weight:700; color:var(--text); margin-bottom:10px;">📋 Veritabanı Tablo Yapıları (Şemalar)</div>
      <div class="schema-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:12px;">
        <div style="background:var(--surface); padding:8px 12px; border-radius:6px; border:1px solid var(--border)">
          <div style="font-weight:700; color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.75rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:4px">EMPLOYEES</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--muted); line-height:1.4">
            employee_id <span style="color:var(--accent3)">[PK]</span><br>
            first_name<br>
            last_name<br>
            email<br>
            hire_date<br>
            job_id <span style="color:var(--accent2)">[FK]</span><br>
            salary<br>
            commission_pct<br>
            manager_id <span style="color:var(--accent2)">[FK]</span><br>
            department_id <span style="color:var(--accent2)">[FK]</span>
          </div>
        </div>
        <div style="background:var(--surface); padding:8px 12px; border-radius:6px; border:1px solid var(--border)">
          <div style="font-weight:700; color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.75rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:4px">DEPARTMENTS</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--muted); line-height:1.4">
            department_id <span style="color:var(--accent3)">[PK]</span><br>
            department_name<br>
            manager_id <span style="color:var(--accent2)">[FK]</span><br>
            location_id <span style="color:var(--accent2)">[FK]</span>
          </div>
        </div>
        <div style="background:var(--surface); padding:8px 12px; border-radius:6px; border:1px solid var(--border)">
          <div style="font-weight:700; color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.75rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:4px">JOBS</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--muted); line-height:1.4">
            job_id <span style="color:var(--accent3)">[PK]</span><br>
            job_title<br>
            min_salary<br>
            max_salary
          </div>
        </div>
        <div style="background:var(--surface); padding:8px 12px; border-radius:6px; border:1px solid var(--border)">
          <div style="font-weight:700; color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.75rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:4px">LOCATIONS</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--muted); line-height:1.4">
            location_id <span style="color:var(--accent3)">[PK]</span><br>
            street_address<br>
            city<br>
            state_province<br>
            country_id <span style="color:var(--accent2)">[FK]</span>
          </div>
        </div>
        <div style="background:var(--surface); padding:8px 12px; border-radius:6px; border:1px solid var(--border)">
          <div style="font-weight:700; color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.75rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:4px">COUNTRIES</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--muted); line-height:1.4">
            country_id <span style="color:var(--accent3)">[PK]</span><br>
            country_name<br>
            region_id <span style="color:var(--accent2)">[FK]</span>
          </div>
        </div>
        <div style="background:var(--surface); padding:8px 12px; border-radius:6px; border:1px solid var(--border)">
          <div style="font-weight:700; color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.75rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:4px">JOB_GRADES</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--muted); line-height:1.4">
            grade_level <span style="color:var(--accent3)">[PK]</span><br>
            lowest_sal<br>
            highest_sal
          </div>
        </div>
      </div>
    </div>
    <div class="practice-q">${q.q}</div>
    <textarea class="sql-input" id="sql-input" placeholder="SQL kodunuzu buraya yazın..." spellcheck="false" style="min-height: 120px">${q.template || ''}</textarea>
    <div class="feedback" id="feedback"></div>
    <div class="practice-footer">
      <button class="btn btn-primary" onclick="checkPractice()">✓ Kontrol Et</button>
      <button class="btn btn-reset" onclick="resetPracticeInput()">Temizle</button>
    </div>
  `;
  container.appendChild(area);
}

function checkPractice() {
  const les = MODULES[currentModule].lessons[currentLesson];
  const q = les.questions[practiceIdx];
  const val = document.getElementById('sql-input').value.trim().toLowerCase().replace(/\s+/g,' ');
  const fb = document.getElementById('feedback');
  const footer = document.querySelector('.practice-footer');

  const correct = q.answer.some(a => val.includes(a.toLowerCase()));
  fb.className = 'feedback ' + (correct ? 'correct' : 'wrong');
  fb.style.display = 'block';

  if (correct) {
    fb.innerHTML = '✅ <strong>Doğru!</strong> ' + (q.explanation || 'Harika, devam edin!');
    let nextBtn = footer.querySelector('.btn-next');
    if (!nextBtn) {
      nextBtn = document.createElement('button');
      nextBtn.className = 'btn btn-next';
      nextBtn.textContent = practiceIdx + 1 < les.questions.length ? 'Sonraki Soru →' : 'Bölümü Bitir ✓';
      nextBtn.onclick = () => {
        practiceIdx++;
        if (practiceIdx < les.questions.length) renderPracticeQ(les, document.getElementById('content'));
        else { markDone(); nextLesson(); }
      };
      footer.appendChild(nextBtn);
    }
  } else {
    fb.innerHTML = '❌ <strong>Tekrar deneyin.</strong> Sözdizimini kontrol edin. İpucu için 💡 butona tıklayın.';
    document.querySelector('.practice-area').classList.add('shake');
    setTimeout(() => document.querySelector('.practice-area').classList.remove('shake'), 400);
  }
}

function showHint() {
  const les = MODULES[currentModule].lessons[currentLesson];
  const q = les.questions[practiceIdx];
  const fb = document.getElementById('feedback');
  fb.className = 'feedback hint';
  fb.style.display = 'block';
  fb.innerHTML = `💡 <strong>İpucu:</strong> <code style="font-family:'JetBrains Mono',monospace">${q.hint}</code>`;
}

function toggleSchema() {
  const panel = document.getElementById('practice-schema');
  if (panel) {
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }
}

function resetPracticeInput() {
  const les = MODULES[currentModule].lessons[currentLesson];
  const q = les.questions[practiceIdx];
  document.getElementById('sql-input').value = q.template || '';
}

// ─── QUIZ ────────────────────────────────────────────────────────────────────
let quizIdx = 0, quizScore = 0;
function renderQuiz(les, container) {
  quizIdx = 0; quizScore = 0;
  renderQuizQ(les, container);
}

function renderQuizQ(les, container) {
  container.innerHTML = '';
  const q = les.questions[quizIdx];
  const total = les.questions.length;

  const header = document.createElement('div');
  header.className = 'section-title';
  header.innerHTML = `🧠 Quiz <span class="badge badge-yellow">${quizIdx+1} / ${total}</span>`;
  container.appendChild(header);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-title">Soru ${quizIdx+1}</div><p style="font-size:.9rem;margin-bottom:14px">${q.q}</p>`;

  q.opts.forEach((opt, i) => {
    const op = document.createElement('div');
    op.className = 'quiz-option';
    op.dataset.i = i;
    op.innerHTML = `<span class="opt-letter">${String.fromCharCode(65+i)}</span>${opt}`;
    op.onclick = () => {
      container.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
      op.classList.add('selected');
    };
    card.appendChild(op);
  });

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn btn-primary quiz-check-btn';
  checkBtn.textContent = '✓ Onayla';
  checkBtn.onclick = () => checkQuiz(les, container, q);
  card.appendChild(checkBtn);
  container.appendChild(card);
}

function checkQuiz(les, container, q) {
  const selected = container.querySelector('.quiz-option.selected');
  if (!selected) return;
  const i = parseInt(selected.dataset.i);

  container.querySelectorAll('.quiz-option').forEach(op => {
    const idx = parseInt(op.dataset.i);
    if (idx === q.answer) op.classList.add('correct');
    else if (idx === i && i !== q.answer) op.classList.add('wrong');
  });

  if (i === q.answer) { quizScore++; score++; }
  totalQuestions++;

  const checkBtn = container.querySelector('.quiz-check-btn');
  checkBtn.textContent = quizIdx + 1 < les.questions.length ? 'Sonraki Soru →' : `Quizi Bitir (${quizScore}/${les.questions.length})`;
  checkBtn.className = 'btn btn-next quiz-check-btn';
  checkBtn.onclick = () => {
    quizIdx++;
    if (quizIdx < les.questions.length) renderQuizQ(les, container);
    else {
      const pct = Math.round(quizScore / les.questions.length * 100);
      if (pct >= 70) {
        markDone();
      }
      showQuizResult(les, container);
    }
  };
}

function showQuizResult(les, container) {
  container.innerHTML = '';
  const pct = Math.round(quizScore / les.questions.length * 100);
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="section-title" style="margin-bottom:16px">Quiz Sonucu</div>
    <div class="score-widget">
      <div class="score-num">${quizScore}/${les.questions.length}</div>
      <div><div style="font-size:1rem;font-weight:700;color:${pct>=70?'var(--accent2)':'var(--accent4)'}">${pct}%</div><div class="score-label">${pct>=70?'✅ Başarılı!':'❌ Tekrar çalış'}</div></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn btn-next" onclick="nextLesson()">Devam Et →</button>
      ${pct < 70 ? `<button class="btn btn-hint" onclick="renderQuiz(MODULES[currentModule].lessons[currentLesson], document.getElementById('content'))">🔄 Tekrar Dene</button>` : ''}
    </div>`;
  container.appendChild(div);
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
function markDone() {
  completedLessons.add(`${currentModule}-${currentLesson}`);
  saveProgress();
  buildNav();
  updateProgress();
}

function nextLesson() {
  const mod = MODULES[currentModule];
  if (currentLesson + 1 < mod.lessons.length) {
    currentLesson++;
  } else if (currentModule + 1 < MODULES.length) {
    currentModule++;
    currentLesson = 0;
  }
  saveProgress();
  buildNav();
  renderLesson();
  document.getElementById('content').scrollTop = 0;
}

// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
function saveProgress() {
  try {
    const data = {
      currentModule,
      currentLesson,
      completedLessons: Array.from(completedLessons)
    };
    localStorage.setItem('vts_sql_tutor_progress', JSON.stringify(data));
  } catch (e) {
    console.error('Progress could not be saved to localStorage:', e);
  }
}

function loadProgress() {
  try {
    const dataStr = localStorage.getItem('vts_sql_tutor_progress');
    if (dataStr) {
      const data = JSON.parse(dataStr);
      if (typeof data.currentModule === 'number' && data.currentModule >= 0 && data.currentModule < MODULES.length) {
        currentModule = data.currentModule;
      }
      if (typeof data.currentLesson === 'number' && data.currentLesson >= 0) {
        const mod = MODULES[currentModule];
        if (mod && data.currentLesson < mod.lessons.length) {
          currentLesson = data.currentLesson;
        }
      }
      if (Array.isArray(data.completedLessons)) {
        completedLessons = new Set(data.completedLessons);
      }
    }
  } catch (e) {
    console.error('Progress could not be loaded from localStorage:', e);
  }
}

function resetProgress() {
  if (confirm("İlerlemenizi sıfırlamak istediğinizden emin misiniz?")) {
    completedLessons.clear();
    currentModule = 0;
    currentLesson = 0;
    saveProgress();
    buildNav();
    renderLesson();
  }
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function copyCode(btn) {
  const block = btn.parentElement;
  const text = block.innerText.replace('Kopyala','').trim();
  navigator.clipboard.writeText(text).then(() => { btn.textContent = '✓ Kopyalandı'; setTimeout(() => btn.textContent = 'Kopyala', 1500); });
}

// ─── START ───────────────────────────────────────────────────────────────────
init();
</script>
