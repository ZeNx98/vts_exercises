<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Lab 3–11 – Interactive Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #d29922;
    --accent4: #f78166;
    --text: #e6edf3;
    --muted: #8b949e;
    --code-bg: #0d1117;
    --radius: 10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;min-height:100vh;overflow-x:hidden}

  /* ── LAYOUT ── */
  .app{display:flex;height:100vh}
  .sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}

  /* ── SIDEBAR ── */
  .logo{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
  .logo h1{font-size:1rem;font-weight:800;letter-spacing:.04em;color:var(--accent)}
  .logo p{font-size:.7rem;color:var(--muted);margin-top:3px}
  .nav-section{padding:10px 12px 4px;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border-radius:6px;margin:1px 6px;font-size:.78rem;transition:all .15s;color:var(--muted)}
  .nav-item:hover{background:var(--surface2);color:var(--text)}
  .nav-item.active{background:rgba(88,166,255,.12);color:var(--accent);font-weight:600}
  .nav-item .dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;transition:.15s}
  .nav-item.done .dot{background:var(--accent2)}
  .nav-item.active .dot{background:var(--accent)}

  /* ── TOPBAR ── */
  .topbar{padding:14px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .topbar h2{font-size:1rem;font-weight:700}
  .progress-bar{height:4px;background:var(--border);border-radius:2px;width:200px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s}
  .progress-label{font-size:.7rem;color:var(--muted);margin-top:4px;text-align:right}

  /* ── CONTENT ── */
  .content{flex:1;overflow-y:auto;padding:28px 36px}
  .section-title{font-size:1.5rem;font-weight:800;margin-bottom:6px}
  .section-sub{color:var(--muted);font-size:.85rem;margin-bottom:24px;line-height:1.6}

  /* ── CARDS ── */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px}
  .card-title{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .card p{font-size:.88rem;line-height:1.7;color:#c9d1d9}
  .card ul{list-style:none;margin-top:8px}
  .card ul li{font-size:.85rem;padding:4px 0;color:#c9d1d9;padding-left:14px;position:relative;line-height:1.6}
  .card ul li::before{content:'›';position:absolute;left:0;color:var(--accent)}
  .highlight{color:var(--accent3);font-weight:600}
  .green{color:var(--accent2);font-weight:600}
  .red{color:var(--accent4);font-weight:600}

  /* ── CODE BLOCK ── */
  .code-block{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:16px 18px;font-family:'JetBrains Mono',monospace;font-size:.8rem;line-height:1.8;margin:10px 0;position:relative;overflow-x:auto}
  .code-block .kw{color:#ff7b72}
  .code-block .fn{color:#d2a8ff}
  .code-block .str{color:#a5d6ff}
  .code-block .cm{color:var(--muted);font-style:italic}
  .code-block .num{color:#79c0ff}
  .copy-btn{position:absolute;top:8px;right:8px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:3px 9px;border-radius:5px;font-size:.7rem;cursor:pointer;font-family:'Sora',sans-serif;transition:.15s}
  .copy-btn:hover{color:var(--text);border-color:var(--accent)}

  /* ── PRACTICE AREA ── */
  .practice-area{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:20px}
  .practice-header{background:var(--surface);padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .practice-header span{font-size:.8rem;font-weight:700;color:var(--accent2)}
  .practice-q{padding:14px 18px;background:var(--surface2);font-size:.85rem;line-height:1.6;color:#c9d1d9;border-bottom:1px solid var(--border)}
  .practice-q strong{color:var(--accent3)}
  .sql-input{width:100%;background:var(--code-bg);border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;padding:14px 18px;resize:vertical;min-height:80px;outline:none;border-bottom:1px solid var(--border)}
  .sql-input:focus{background:#0a0e14}
  .practice-footer{padding:10px 16px;display:flex;align-items:center;gap:10px;background:var(--surface)}
  .btn{padding:7px 18px;border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer;border:none;font-family:'Sora',sans-serif;transition:all .15s;letter-spacing:.02em}
  .btn-primary{background:var(--accent);color:#0d1117}
  .btn-primary:hover{background:#79b8ff}
  .btn-hint{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
  .btn-hint:hover{color:var(--text);border-color:var(--accent3)}
  .btn-next{background:var(--accent2);color:#0d1117}
  .btn-next:hover{background:#56d364}
  .btn-reset{background:transparent;color:var(--muted);border:1px solid var(--border);font-size:.72rem}
  .btn-reset:hover{color:var(--accent4);border-color:var(--accent4)}
  .feedback{padding:10px 16px;font-size:.8rem;line-height:1.6;border-top:1px solid var(--border);display:none}
  .feedback.correct{display:block;background:rgba(63,185,80,.08);color:var(--accent2)}
  .feedback.wrong{display:block;background:rgba(247,129,102,.08);color:var(--accent4)}
  .feedback.hint{display:block;background:rgba(210,153,34,.08);color:var(--accent3)}

  /* ── QUIZ ── */
  .quiz-option{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:7px;border:1px solid var(--border);margin:6px 0;cursor:pointer;transition:.15s;font-size:.84rem;line-height:1.5;color:#c9d1d9}
  .quiz-option:hover{border-color:var(--accent);background:rgba(88,166,255,.05)}
  .quiz-option.selected{border-color:var(--accent);background:rgba(88,166,255,.1);color:var(--text)}
  .quiz-option.correct{border-color:var(--accent2);background:rgba(63,185,80,.1);color:var(--accent2)}
  .quiz-option.wrong{border-color:var(--accent4);background:rgba(247,129,102,.1);color:var(--accent4)}
  .quiz-option .opt-letter{width:22px;height:22px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;margin-top:1px}
  .quiz-check-btn{margin-top:10px}

  /* ── TABLE ── */
  table{width:100%;border-collapse:collapse;font-size:.8rem;font-family:'JetBrains Mono',monospace;margin:10px 0}
  th{background:var(--surface2);padding:7px 12px;text-align:left;color:var(--accent);font-weight:700;border:1px solid var(--border)}
  td{padding:6px 12px;border:1px solid var(--border);color:#c9d1d9}
  tr:nth-child(even) td{background:rgba(255,255,255,.02)}

  /* ── BADGES ── */
  .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:8px}
  .badge-blue{background:rgba(88,166,255,.15);color:var(--accent)}
  .badge-green{background:rgba(63,185,80,.15);color:var(--accent2)}
  .badge-yellow{background:rgba(210,153,34,.15);color:var(--accent3)}

  /* ── TABS ── */
  .tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:0}
  .tab{padding:8px 16px;font-size:.78rem;font-weight:600;cursor:pointer;border-radius:7px 7px 0 0;color:var(--muted);border:1px solid transparent;border-bottom:none;margin-bottom:-1px;transition:.15s}
  .tab.active{background:var(--surface);border-color:var(--border);color:var(--text)}
  .tab-content{display:none}
  .tab-content.active{display:block}

  /* ── SCORE WIDGET ── */
  .score-widget{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:16px}
  .score-num{font-size:2rem;font-weight:800;color:var(--accent);font-family:'JetBrains Mono',monospace}
  .score-label{font-size:.78rem;color:var(--muted)}

  /* ── ANIMATIONS ── */
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .content > *{animation:fadeIn .25s ease both}
  .shake{animation:shake .35s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  /* ── RESPONSIVE ── */
  @media(max-width:720px){
    .sidebar{width:200px}
    .content{padding:18px 16px}
    .section-title{font-size:1.2rem}
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <h1>⚡ SQL Tutor</h1>
      <p>Veri Tabanı Lab 3 – 11</p>
    </div>
    <div id="nav-container"></div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <h2 id="topbar-title">SQL Lab 3–11</h2>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="text-align:right">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
          <div class="progress-label" id="progress-label">0 / 9 tamamlandı</div>
        </div>
        <button class="btn btn-reset" onclick="resetProgress()" title="İlerlemeyi Sıfırla" style="padding:4px 8px;margin:0">🔄 Sıfırla</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const MODULES = [
  {
    id: 'logical',
    title: 'Mantıksal Operatörler',
    icon: '🔀',
    lessons: [
      {
        type: 'lesson',
        title: 'AND, OR, NOT',
        content: `
          <div class="section-title">Mantıksal Operatörler</div>
          <div class="section-sub">İki veya daha fazla koşulun sonucunu birleştirerek tek bir sonuç üretir. Bir sonuç yalnızca genel koşul TRUE ise döner.</div>
          <div class="card"><div class="card-title">AND Operatörü</div><p>Her iki koşul da <span class="green">TRUE</span> ise sonuç TRUE döner.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">SELECT</span> last_name, salary, department_id<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> salary &gt;= <span class="num">5000</span><br>  <span class="kw">AND</span> department_id = <span class="num">10</span>;</div>
          </div>
          <div class="card"><div class="card-title">OR Operatörü</div><p>Koşullardan <span class="highlight">en az biri</span> TRUE ise sonuç TRUE döner.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">SELECT</span> last_name, salary<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> salary &lt; <span class="num">3000</span><br>  <span class="kw">OR</span>  salary &gt; <span class="num">10000</span>;</div>
          </div>
          <div class="card"><div class="card-title">NOT Operatörü</div><p>Koşul <span class="red">FALSE</span> ise TRUE döner. Ters çevirir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">SELECT</span> last_name, job_id<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> <span class="kw">NOT</span> (job_id = <span class="str">'IT_PROG'</span>);</div>
          </div>
          <div class="card"><div class="card-title">⚠️ Öncelik Sırası</div>
          <ul>
            <li><span class="red">AND</span> operatörü, <span class="highlight">OR</span>'dan önce değerlendirilir.</li>
            <li>Önceliği değiştirmek için <span class="green">parantez</span> kullanın.</li>
          </ul>
          <div class="code-block"><span class="cm">-- AND önce, OR sonra:</span><br><span class="kw">WHERE</span> job_id = <span class="str">'SA_MAN'</span> <span class="kw">OR</span>  job_id = <span class="str">'IT_PROG'</span> <span class="kw">AND</span> salary &gt; <span class="num">5000</span>;<br><span class="cm">-- Parantezle öncelik değişir:</span><br><span class="kw">WHERE</span> (job_id = <span class="str">'SA_MAN'</span> <span class="kw">OR</span> job_id = <span class="str">'IT_PROG'</span>) <span class="kw">AND</span> salary &gt; <span class="num">5000</span>;</div>
          </div>
          <div class="card"><div class="card-title">📅 Tarih Notu</div>
          <p>Tarihler <span class="green">tek tırnak</span> içinde yazılmalıdır. Varsayılan format: <span class="highlight">DD-MON-YYYY</span></p>
          <div class="code-block"><span class="kw">WHERE</span> hire_date &gt; <span class="str">'01-JAN-2020'</span></div>
          </div>`
      },
      {
        type: 'practice',
        title: 'AND / OR Alıştırması',
        questions: [
          { q: 'Maaşı 5000 ile 10000 arasında <strong>VE</strong> department_id\'si 20 olan çalışanları getiren sorguyu yazın.', answer: ['salary >= 5000 and salary <= 10000 and department_id = 20', 'salary between 5000 and 10000 and department_id = 20'], hint: 'SELECT last_name FROM employees WHERE salary >= 5000 AND salary <= 10000 AND department_id = 20;', template: 'SELECT last_name, salary\nFROM employees\nWHERE ' },
          { q: 'Job_id\'si <strong>\'IT_PROG\'</strong> VEYA <strong>\'SA_MAN\'</strong> olan çalışanları getiren WHERE koşulunu yazın.', answer: ["job_id = 'it_prog' or job_id = 'sa_man'", "job_id = 'sa_man' or job_id = 'it_prog'"], hint: "WHERE job_id = 'IT_PROG' OR job_id = 'SA_MAN'", template: 'SELECT last_name, job_id\nFROM employees\nWHERE ' },
        ]
      },
      {
        type: 'quiz',
        title: 'Mantıksal Operatörler Quiz',
        questions: [
          { q: 'AND ve OR birlikte kullanıldığında hangisi önce değerlendirilir?', opts: ['OR', 'AND', 'NOT', 'İkisi eşit'], answer: 1 },
          { q: 'NOT operatörü ne zaman TRUE döner?', opts: ['Her zaman', 'Koşul FALSE ise', 'Koşul NULL ise', 'Hiçbir zaman'], answer: 1 },
          { q: 'Tarih değerleri SQL\'de nasıl yazılmalıdır?', opts: ['Çift tırnak "01-JAN-2020"', 'Tek tırnak \'01-JAN-2020\'', 'Tırnaksız: 01-JAN-2020', 'Köşeli parantez [01-JAN-2020]'], answer: 1 },
        ]
      }
    ]
  },
  {
    id: 'orderby',
    title: 'ORDER BY',
    icon: '↕️',
    lessons: [
      {
        type: 'lesson',
        title: 'ORDER BY Kullanımı',
        content: `
          <div class="section-title">ORDER BY ile Sıralama</div>
          <div class="section-sub">SQL verileri sıralamak için ORDER BY kullanır. Varsayılan sıralama <span style="color:var(--accent2)">ASC</span> (artan) yönündedir.</div>
          <div class="card"><div class="card-title">Varsayılan Sıralama Kuralları</div>
          <ul>
            <li>Sayısal değerler: küçükten büyüğe</li>
            <li>Tarihler: eskiden yeniye</li>
            <li>Karakter değerler: alfabetik</li>
            <li>NULL değerler: ASC'de <strong>en sonda</strong>, DESC'de <strong>en başta</strong></li>
          </ul></div>
          <div class="card"><div class="card-title">ASC / DESC</div>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Artan sıralama (varsayılan)</span><br><span class="kw">SELECT</span> last_name, salary<br><span class="kw">FROM</span> employees<br><span class="kw">ORDER BY</span> salary;<br><br><span class="cm">-- Azalan sıralama</span><br><span class="kw">SELECT</span> last_name, salary<br><span class="kw">FROM</span> employees<br><span class="kw">ORDER BY</span> salary <span class="kw">DESC</span>;</div></div>
          <div class="card"><div class="card-title">Alias ile Sıralama</div>
          <p>SELECT'te tanımlanan alias ORDER BY'da kullanılabilir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">SELECT</span> last_name, salary * <span class="num">12</span> <span class="kw">AS</span> annual_salary<br><span class="kw">FROM</span> employees<br><span class="kw">ORDER BY</span> annual_salary <span class="kw">DESC</span>;</div></div>
          <div class="card"><div class="card-title">Birden Fazla Sütuna Göre Sıralama</div>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">SELECT</span> last_name, department_id, salary<br><span class="kw">FROM</span> employees<br><span class="kw">ORDER BY</span> department_id, salary <span class="kw">DESC</span>;</div></div>
          <div class="card"><div class="card-title">SELECT Çalışma Sırası</div>
          <ul>
            <li>1. <span class="red">FROM</span> → Tabloyu seç</li>
            <li>2. <span class="highlight">WHERE</span> → Filtrele</li>
            <li>3. <span class="green">SELECT</span> → Sütunları seç</li>
            <li>4. <span class="accent">ORDER BY</span> → Sırala</li>
          </ul></div>`
      },
      {
        type: 'practice',
        title: 'ORDER BY Alıştırması',
        questions: [
          { q: 'Tüm çalışanları <strong>maaşa göre azalan</strong> sırada getiren ORDER BY ifadesini yazın.', answer: ['order by salary desc', 'order by salary descending'], hint: 'ORDER BY salary DESC', template: 'SELECT last_name, salary\nFROM employees\n' },
          { q: '<strong>department_id</strong>\'ye göre artan, aynı departmanda <strong>salary</strong>\'ye göre azalan sıralama yapın.', answer: ['order by department_id, salary desc', 'order by department_id asc, salary desc'], hint: 'ORDER BY department_id, salary DESC', template: 'SELECT last_name, department_id, salary\nFROM employees\n' },
        ]
      },
      {
        type: 'quiz',
        title: 'ORDER BY Quiz',
        questions: [
          { q: 'ORDER BY ile NULL değerler ASC sıralamada nerede görünür?', opts: ['En başta', 'En sonda', 'Ortada', 'Gösterilmez'], answer: 1 },
          { q: 'SELECT çalışma sırasında ORDER BY kaçıncı adımda değerlendirilir?', opts: ['1. adım', '2. adım', '3. adım', '4. adım (en son)'], answer: 3 },
          { q: 'SELECT içinde tanımlanan bir alias ORDER BY\'da kullanılabilir mi?', opts: ['Hayır, hata verir', 'Evet, kullanılabilir', 'Sadece sayısal aliaslarda', 'Sadece WHERE\'de'], answer: 1 },
        ]
      }
    ]
  },
  {
    id: 'datatypes',
    title: 'Veri Tipleri',
    icon: '🏷️',
    lessons: [
      {
        type: 'lesson',
        title: 'Veri Tipleri',
        content: `
          <div class="section-title">Veri Tipleri</div>
          <div class="section-sub">Tablo oluştururken her sütun için veri tipi belirlemek zorunludur. Yanlış seçim dönüşüm hatalarına yol açabilir.</div>
          <div class="card"><div class="card-title">VARCHAR2</div><p>Değişken uzunlukta karakter verisi. Girilen veri kadar yer kaplar.</p><ul><li>İsim, Soyisim, E-posta, Adres gibi değişken uzunluklu metinler</li><li>Örnek: <span class="code-block" style="display:inline;padding:2px 6px">VARCHAR2(100)</span></li></ul></div>
          <div class="card"><div class="card-title">CHAR</div><p>Sabit uzunlukta karakter verisi. Uzunluğu baştan belirlenir, boş kalan kısmı doldurur.</p><ul><li>TC Kimlik No (11 karakter), Ülke kodu (TR, US)</li><li>Örnek: <span class="code-block" style="display:inline;padding:2px 6px">CHAR(11)</span></li></ul></div>
          <div class="card"><div class="card-title">NUMBER</div><p>Sayısal veriler. Matematiksel işlemler yapılabilir, metin içeremez.</p><ul><li>Maaş, Ürün fiyatı, Yaş, Miktar</li><li>Örnek: <span class="code-block" style="display:inline;padding:2px 6px">NUMBER(8,2)</span> → 8 basamak, 2 ondalık</li></ul></div>
          <div class="card"><div class="card-title">DATE</div><p>Oracle'da DATE hem <span class="highlight">tarih</span> hem <span class="highlight">saat</span> bilgisi tutar. Varsayılan gösterim: <span class="green">DD-MON-YYYY</span></p>

        title: 'Self-Join ve Hiyerarşik Sorgular',
        content: `
          <div class="section-title">Self-Join & Hiyerarşik Sorgular</div>
          <div class="section-sub">Bir tablo kendi kendisiyle birleştirilebilir. Çalışan-yönetici, öğrenci-danışman gibi hiyerarşik ilişkiler sorgulanabilir.</div>
          <div class="card"><div class="card-title">Self-Join Nedir?</div>
          <p>Aynı tabloya <span class="green">iki farklı alias</span> verilerek kendi kendisiyle join yapılması.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Çalışan ve yöneticisini listele</span><br><span class="kw">SELECT</span> e.last_name <span class="kw">AS</span> employee,<br>       m.last_name <span class="kw">AS</span> manager<br><span class="kw">FROM</span> employees e<br><span class="kw">JOIN</span> employees m <span class="kw">ON</span> (e.manager_id = m.employee_id);<br><span class="cm">-- e = çalışan, m = yönetici (aynı tablo!)</span></div></div>
          <div class="card"><div class="card-title">Self-Join Kullanım Alanları</div>
          <ul>
            <li>Çalışan ve yöneticisi</li>
            <li>Öğrenci ve danışmanı</li>
            <li>Ürün ve ana ürünü</li>
            <li>Organizasyon yapısı</li>
          </ul></div>
          <div class="card"><div class="card-title">Hiyerarşik Sorgu — CONNECT BY (Oracle)</div>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Yukarıdan aşağıya hiyerarşi</span><br><span class="kw">SELECT</span> employee_id, last_name, manager_id, LEVEL<br><span class="kw">FROM</span> employees<br><span class="kw">START WITH</span> employee_id = <span class="num">100</span>   <span class="cm">-- başlangıç noktası</span><br><span class="kw">CONNECT BY PRIOR</span> employee_id = manager_id;<br><br><span class="cm">-- Aşağıdan yukarıya (çalışandan yöneticiye)</span><br><span class="kw">SELECT</span> employee_id, last_name, manager_id<br><span class="kw">FROM</span> employees<br><span class="kw">START WITH</span> employee_id = <span class="num">101</span><br><span class="kw">CONNECT BY</span> employee_id = <span class="kw">PRIOR</span> manager_id;</div></div>
          <div class="card"><div class="card-title">LEVEL ve LPAD ile Görselleştirme</div>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">SELECT</span> <span class="fn">LPAD</span>(last_name, <span class="fn">LENGTH</span>(last_name)+(LEVEL*<span class="num">2</span>)-<span class="num">2</span>, <span class="str">'_'</span>) <span class="kw">AS</span> org<br><span class="kw">FROM</span> employees<br><span class="kw">START WITH</span> employee_id = <span class="num">100</span><br><span class="kw">CONNECT BY PRIOR</span> employee_id = manager_id;</div></div>
          <div class="card"><div class="card-title">Temel Kavramlar</div>
          <table><tr><th>Kavram</th><th>Açıklama</th></tr>
          <tr><td><span class="green">LEVEL</span></td><td>Hiyerarşideki seviye (1 = kök)</td></tr>
          <tr><td><span class="highlight">PRIOR</span></td><td>Bir önceki / üst seviyeye atıf</td></tr>
          <tr><td><span class="accent">START WITH</span></td><td>Başlangıç noktası</td></tr>

          <div class="section-title">CUBE ve GROUPING SETS</div>
          <div class="section-sub">ROLLUP gibi GROUP BY uzantılarıdır. CUBE tüm kombinasyonları üretir; GROUPING SETS ise yalnızca belirtilen gruplamaları üretir.</div>
          <div class="card"><div class="card-title">CUBE</div>
          <p>ROLLUP'tan farklı olarak, <span class="green">tüm olası grup kombinasyonları</span> için toplamlar üretir. Çapraz tablolama (cross-tab) analizlerinde kullanılır.</p>
          <ul>
            <li>n adet sütun varsa: <span class="highlight">2ⁿ adet kombinasyon</span> oluşur</li>
            <li>CUBE(a, b) → (a,b), (a), (b), () = 4 grup</li>
          </ul>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">SELECT</span> department_id, job_id, <span class="fn">SUM</span>(salary)<br><span class="kw">FROM</span> employees<br><span class="kw">GROUP BY</span> <span class="fn">CUBE</span>(department_id, job_id);<br><span class="cm">-- (dept,job) + (dept) + (job) + () kombinasyonlarını üretir</span></div></div>
          <div class="card"><div class="card-title">ROLLUP vs CUBE Karşılaştırma</div>
          <table><tr><th>Özellik</th><th>ROLLUP</th><th>CUBE</th></tr>
          <tr><td>Kombinasyon sayısı</td><td>n+1</td><td>2ⁿ</td></tr>
          <tr><td>Yön</td><td>Sağdan sola hiyerarşik</td><td>Tüm yönler</td></tr>
          <tr><td>Kullanım</td><td>Hiyerarşik raporlar</td><td>Çapraz tablolama</td></tr></table></div>
          <div class="card"><div class="card-title">GROUPING SETS</div>
          <p>Tek sorguda <span class="green">birden fazla GROUP BY işlemi</span> yapmayı sağlar. Yalnızca belirtilen kombinasyonlar hesaplanır.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Klasik yöntem: 3 ayrı sorgu gerekir</span><br><span class="cm">-- GROUPING SETS ile tek sorguda:</span><br><span class="kw">SELECT</span> department_id, job_id, <span class="fn">SUM</span>(salary)<br><span class="kw">FROM</span> employees<br><span class="kw">GROUP BY</span> <span class="fn">GROUPING SETS</span> (<br>  (job_id, manager_id),<br>  (department_id, job_id),<br>  (department_id, manager_id)<br>);<br><span class="cm">-- Her kombinasyon için ayrı sonuç üretir</span></div></div>

          <div class="section-sub">ROLLUP ve CUBE kullanıldığında sonuçta hem gerçek veri hem de hesaplanmış toplam satırları bulunur. GROUPING fonksiyonu bu iki türü ayırt etmemizi sağlar.</div>
          <div class="card"><div class="card-title">Problem: Hangi Satır Gerçek, Hangi Toplam?</div>
          <p>ROLLUP/CUBE çıktısındaki NULL değerleri <span class="red">gerçek NULL</span> mi yoksa <span class="highlight">hesaplanmış toplam satırı</span> mı olduğunu söylemez. Bu ayrımı yapmadan:</p>

            <li><span class="red">Double counting</span> problemi oluşur</li>
          </ul></div>
          <div class="card"><div class="card-title">Çözüm: GROUPING(sütun)</div>
          <p>GROUPING fonksiyonu bir sütunun o satırda:</p>
          <ul>
            <li><span class="green">0</span> → Gerçek veri satırı</li>
            <li><span class="red">1</span> → Hesaplanmış toplam satırı (ROLLUP/CUBE tarafından)</li>
          </ul>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">SELECT</span> department_id, job_id,<br>       <span class="fn">GROUPING</span>(department_id) <span class="kw">AS</span> grp_dept,<br>       <span class="fn">GROUPING</span>(job_id) <span class="kw">AS</span> grp_job,<br>       <span class="fn">SUM</span>(salary)<br><span class="kw">FROM</span> employees<br><span class="kw">GROUP BY</span> <span class="fn">ROLLUP</span>(department_id, job_id);</div></div>
          <div class="card"><div class="card-title">DECODE ile Anlamlı Etiket</div>
          <p>GROUPING çıktısını DECODE veya CASE ile okunaklı hale getirebiliriz.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- DECODE ile toplam satırlarını etiketle</span><br><span class="kw">SELECT</span><br>  <span class="fn">DECODE</span>(<span class="fn">GROUPING</span>(department_id), <span class="num">1</span>, <span class="str">'Dept Toplamı'</span>, department_id) <span class="kw">AS</span> dept,<br>  <span class="fn">DECODE</span>(<span class="fn">GROUPING</span>(job_id), <span class="num">1</span>, <span class="str">'Job Toplamı'</span>, job_id) <span class="kw">AS</span> job,<br>  <span class="fn">SUM</span>(salary)<br><span class="kw">FROM</span> employees<br><span class="kw">GROUP BY</span> <span class="fn">ROLLUP</span>(department_id, job_id);<br><br><span class="cm">-- CASE ile eşdeğer yazım</span><br><span class="kw">CASE WHEN</span> <span class="fn">GROUPING</span>(department_id) = <span class="num">1</span><br>     <span class="kw">THEN</span> <span class="str">'Dept Toplamı'</span><br>     <span class="kw">ELSE</span> department_id <span class="kw">END</span></div></div>
          <div class="card"><div class="card-title">Sadece Gerçek Veri Satırlarını Filtrele</div>
          <p>Toplam satırlarını hariç bırakmak için GROUPING = 0 koşulu kullanılır:</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">SELECT</span> department_id, job_id, <span class="fn">SUM</span>(salary)<br><span class="kw">FROM</span> employees<br><span class="kw">GROUP BY</span> <span class="fn">ROLLUP</span>(department_id, job_id)<br><span class="kw">HAVING</span> <span class="fn">GROUPING</span>(department_id) = <span class="num">0</span><br>  <span class="kw">AND</span> <span class="fn">GROUPING</span>(job_id) = <span class="num">0</span>;<br><span class="cm">-- Yalnızca gerçek veri satırları kalır</span></div></div>`

          <div class="card"><div class="card-title">UNION — Birleşim (Tekrarsız)</div>
          <p>Birden fazla sorgunun sonuçlarını birleştirir; tekrar eden kayıtları <span class="red">kaldırır</span>.</p>

          <div class="card"><div class="card-title">Neden Alt Sorgu?</div>
          <p>Bazı soruları tek adımda yanıtlamak mümkün değildir:</p>
          <ul>

          <div class="card"><div class="card-title">Temel Kurallar</div>
          <ul>
            <li>Alt sorgular <span class="green">parantez içinde</span> yazılır</li>
            <li>Genellikle karşılaştırma operatörlerinin <span class="highlight">sağ tarafında</span> yer alır</li>
            <li>İç ve dış sorgular <span class="accent">farklı tablolardan</span> veri alabilir</li>
            <li><span class="red">ORDER BY</span> yalnızca ana sorguda kullanılır</li>
            <li>Bir sorguda birden fazla alt sorgu kullanılabilir</li>
          </ul></div>
          <div class="card"><div class="card-title">Alt Sorgu Türleri</div>
          <table><tr><th>Tür</th><th>Döndürülen Değer</th><th>Operatör</th></tr>

          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Ortalama maaştan düşük maaş alan çalışanlar</span><br><span class="kw">SELECT</span> last_name, salary<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> salary < (<br>  <span class="kw">SELECT</span> <span class="fn">AVG</span>(salary)<br>  <span class="kw">FROM</span> employees<br>);<br><br><span class="cm">-- Miller'dan sonra işe giren personeller</span><br><span class="kw">SELECT</span> last_name, hire_date<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> hire_date > (<br>  <span class="kw">SELECT</span> hire_date<br>  <span class="kw">FROM</span> employees<br>  <span class="kw">WHERE</span> last_name = <span class="str">'Miller'</span><br>);</div></div>

          <div class="section-title">Çok Satır Alt Sorgular</div>
          <div class="section-sub">İç sorgu birden fazla değer döndürüyorsa tekil karşılaştırma operatörleri (=, >) kullanılamaz. Bunun yerine IN, ANY veya ALL kullanılır.</div>
          <div class="card"><div class="card-title">IN Operatörü</div>
          <p>Alt sorgudan dönen değerleri <span class="green">liste olarak</span> kullanır. Dış sorgu, bu listedeki herhangi bir değere sahip kayıtları getirir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- 20. dept maaşlarıyla aynı maaşı olan çalışanlar</span><br><span class="cm">-- YANLIŞ: = birden fazla değer döndüğünde hata verir!</span><br><span class="kw">WHERE</span> salary = (<span class="kw">SELECT</span> salary <span class="kw">FROM</span> employees <span class="kw">WHERE</span> department_id = <span class="num">20</span>)<br><br><span class="cm">-- DOĞRU: IN kullan</span><br><span class="kw">SELECT</span> last_name, salary<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> salary <span class="kw">IN</span> (<br>  <span class="kw">SELECT</span> salary<br>  <span class="kw">FROM</span> employees<br>  <span class="kw">WHERE</span> department_id = <span class="num">20</span><br>);</div></div>
          <div class="card"><div class="card-title">ANY Operatörü</div>
          <p>Alt sorgudaki değerlerden <span class="highlight">en az biri</span> ile karşılaştırma yapılır. Koşul sağlanırsa kayıt döner.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Dept 20'deki herhangi bir maaştan küçük olanlar</span><br><span class="kw">SELECT</span> last_name, salary<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> salary &lt; <span class="kw">ANY</span> (<br>  <span class="kw">SELECT</span> salary<br>  <span class="kw">FROM</span> employees<br>  <span class="kw">WHERE</span> department_id = <span class="num">20</span><br>);<br><span class="cm">-- Herhangi birinden küçükse getirir (= maksimumdan küçük)</span></div></div>
          <div class="card"><div class="card-title">ALL Operatörü</div>
          <p>Alt sorgudaki <span class="accent">tüm değerler</span> ile karşılaştırma yapılır. Koşul hepsi için sağlanmalıdır.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Dept 20'deki TÜM maaşlardan küçük olanlar</span><br><span class="kw">SELECT</span> last_name, salary<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> salary &lt; <span class="kw">ALL</span> (<br>  <span class="kw">SELECT</span> salary<br>  <span class="kw">FROM</span> employees<br>  <span class="kw">WHERE</span> department_id = <span class="num">20</span><br>);<br><span class="cm">-- Tümünden küçükse getirir (= minimumdan küçük)</span></div></div>
          <div class="card"><div class="card-title">Operatör Karşılaştırması</div>
          <table><tr><th>Operatör</th><th>Anlamı</th><th>Eşdeğeri</th></tr>
          <tr><td><span class="green">IN</span></td><td>Listede var mı?</td><td>= ANY</td></tr>
          <tr><td><span class="highlight">> ANY</span></td><td>Herhangi birinden büyük</td><td>> MIN()</td></tr>
          <tr><td><span class="highlight">< ANY</span></td><td>Herhangi birinden küçük</td><td>< MAX()</td></tr>
          <tr><td><span class="accent">> ALL</span></td><td>Hepsinden büyük</td><td>> MAX()</td></tr>
          <tr><td><span class="accent">< ALL</span></td><td>Hepsinden küçük</td><td>< MIN()</td></tr></table></div>
          <div class="card"><div class="card-title">⚠️ NULL Değerler ve IN / ANY / ALL</div>
          <ul>
            <li><span class="green">IN veya ANY</span>: NULL görmezden gelinir, eşleşen normal değerler döner</li>
            <li><span class="red">ALL</span>: İçeride NULL varsa sonuç belirsiz (UNKNOWN) olur → <span class="red">hiç satır dönmez</span></li>
          </ul>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- NOT IN + NULL → hiç kayıt dönmez!</span><br><span class="kw">SELECT</span> last_name<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> employee_id <span class="kw">NOT IN</span> (<br>  <span class="kw">SELECT</span> manager_id    <span class="cm">-- manager_id içinde NULL var!</span><br>  <span class="kw">FROM</span> employees<br>);<br><span class="cm">-- Çözüm: WHERE manager_id IS NOT NULL ekle</span></div></div>

        content: `
          <div class="section-title">Çoklu Sütun Alt Sorgular ve EXISTS</div>
          <div class="section-sub">Alt sorgular birden fazla sütun döndürebilir. Eşleşme varlığını kontrol etmek için EXISTS / NOT EXISTS kullanılır.</div>
          <div class="card"><div class="card-title">Çoklu Sütun Alt Sorgusu</div>
          <p>Birden fazla sütun birlikte karşılaştırılır. Sütunlar parantez içinde birlikte yazılır.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Aynı department ve job kombinasyonuna sahip çalışanlar</span><br><span class="kw">SELECT</span> last_name, department_id, job_id<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> (department_id, job_id) <span class="kw">IN</span> (<br>  <span class="kw">SELECT</span> department_id, job_id<br>  <span class="kw">FROM</span> employees<br>  <span class="kw">WHERE</span> last_name = <span class="str">'Taylor'</span><br>);</div></div>
          <div class="card"><div class="card-title">Çift Olmayan (Non-Pairwise) Karşılaştırma</div>
          <p>Sütunlar birlikte değil, <span class="highlight">ayrı ayrı</span> karşılaştırılır. Bu daha geniş bir sonuç kümesi üretir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Pairwise (birlikte): aynı kombinasyon</span><br><span class="kw">WHERE</span> (department_id, job_id) <span class="kw">IN</span> (alt_sorgu)<br><br><span class="cm">-- Non-pairwise (ayrı ayrı): daha geniş eşleşme</span><br><span class="kw">WHERE</span> department_id <span class="kw">IN</span> (alt_sorgu1)<br>  <span class="kw">AND</span> job_id <span class="kw">IN</span> (alt_sorgu2)</div></div>
          <div class="card"><div class="card-title">EXISTS ve NOT EXISTS</div>
          <p>Alt sorguda eşleşme <strong>olup olmadığını</strong> kontrol eder. Bir değer değil, TRUE/FALSE döner.</p>
          <ul>
            <li><span class="green">EXISTS</span> → Alt sorguda en az bir kayıt varsa TRUE döner</li>
            <li><span class="red">NOT EXISTS</span> → Alt sorguda hiç kayıt yoksa TRUE döner</li>
          </ul>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- En az bir çalışanı olan departmanlar (yöneticiler)</span><br><span class="kw">SELECT</span> last_name, employee_id<br><span class="kw">FROM</span> employees e<br><span class="kw">WHERE</span> <span class="kw">EXISTS</span> (<br>  <span class="kw">SELECT</span> <span class="num">1</span><br>  <span class="kw">FROM</span> employees<br>  <span class="kw">WHERE</span> manager_id = e.employee_id<br>);<br><span class="cm">-- Yönetici olan çalışanlar</span><br><br><span class="kw">SELECT</span> last_name, employee_id<br><span class="kw">FROM</span> employees e<br><span class="kw">WHERE</span> <span class="kw">NOT EXISTS</span> (<br>  <span class="kw">SELECT</span> <span class="num">1</span><br>  <span class="kw">FROM</span> employees<br>  <span class="kw">WHERE</span> manager_id = e.employee_id<br>);<br><span class="cm">-- Yönetici olmayan çalışanlar</span></div></div>
          <div class="card"><div class="card-title">İç İçe (Nested) Alt Sorgular</div>
          <p>Bir alt sorgunun içine başka bir alt sorgu yerleştirilebilir. Her seviye parantez içinde çözülür.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Ortalamadan fazla çalışanı olan departmanlar</span><br><span class="kw">SELECT</span> department_id, <span class="fn">COUNT</span>(*)<br><span class="kw">FROM</span> employees<br><span class="kw">GROUP BY</span> department_id<br><span class="kw">HAVING</span> <span class="fn">COUNT</span>(*) > (<br>  <span class="kw">SELECT</span> <span class="fn">AVG</span>(<span class="fn">COUNT</span>(*))<br>  <span class="kw">FROM</span> employees<br>  <span class="kw">GROUP BY</span> department_id<br>);<br><span class="cm">-- İçteki COUNT → her dept sayısı</span><br><span class="cm">-- Ortadaki AVG → departman başına ortalama</span><br><span class="cm">-- Dıştaki → bu ortalamayı aşan dept'leri getirir</span></div></div>
          <div class="card"><div class="card-title">Güvenli Alt Sorgu: = mi, IN mi?</div>
          <p>Alt sorgunun kaç satır döndüreceğinden emin değilsen <span class="green">'='</span> yerine <span class="green">'IN'</span> kullan. IN her iki durumda da çalışır.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Riskli: birden fazla satır dönerse hata!</span><br><span class="kw">WHERE</span> salary = (<span class="kw">SELECT</span> salary <span class="kw">FROM</span> employees <span class="kw">WHERE</span> job_id = <span class="str">'SA_REP'</span>)<br><br><span class="cm">-- Güvenli: her zaman çalışır</span><br><span class="kw">WHERE</span> salary <span class="kw">IN</span> (<span class="kw">SELECT</span> salary <span class="kw">FROM</span> employees <span class="kw">WHERE</span> job_id = <span class="str">'SA_REP'</span>)</div></div>`
      },
      {
        type: 'practice',
        title: 'EXISTS / Çoklu Sütun Alıştırması',

          <div class="section-title">Transaction Yönetimi</div>
          <div class="section-sub">Transaction, bir veya daha fazla DML işlemini kapsayan ve atomik şekilde gerçekleşen çalışma birimidir. Ya hepsi gerçekleşir ya da hiçbiri gerçekleşmez.</div>
          <div class="card"><div class="card-title">COMMIT — Değişiklikleri Kalıcılaştır</div>
          <p>COMMIT yapılmadan değişiklikler <span class="highlight">geçici</span>dir ve yalnızca o oturumdan görünür.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">INSERT INTO</span> copy_employees (employee_id, last_name, job_id)<br><span class="kw">VALUES</span> (<span class="num">300</span>, <span class="str">'Smith'</span>, <span class="str">'IT_PROG'</span>);<br><br><span class="kw">UPDATE</span> copy_employees <span class="kw">SET</span> salary = <span class="num">6000</span> <span class="kw">WHERE</span> employee_id = <span class="num">300</span>;<br><br><span class="kw">COMMIT</span>;  <span class="cm">-- Değişiklikler kalıcı hale gelir</span></div></div>
          <div class="card"><div class="card-title">ROLLBACK — Değişiklikleri Geri Al</div>
          <p>Son COMMIT'ten bu yana yapılan tüm değişiklikleri <span class="red">geri alır</span>.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">DELETE FROM</span> copy_employees <span class="kw">WHERE</span> employee_id = <span class="num">300</span>;<br><br><span class="kw">ROLLBACK</span>;  <span class="cm">-- Silme işlemi geri alındı</span></div></div>
          <div class="card"><div class="card-title">SAVEPOINT — Geri Dönüş Noktası</div>
          <p>Transaction içinde belirli noktalara <span class="green">işaret</span> koyarak kısmi geri alma yapılabilir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">INSERT INTO</span> copy_employees <span class="kw">VALUES</span> (<span class="num">300</span>, ...);<br><span class="kw">SAVEPOINT</span> sp1;              <span class="cm">-- Nokta 1</span><br><br><span class="kw">UPDATE</span> copy_employees <span class="kw">SET</span> salary = <span class="num">8000</span> <span class="kw">WHERE</span> employee_id = <span class="num">300</span>;<br><span class="kw">SAVEPOINT</span> sp2;              <span class="cm">-- Nokta 2</span><br><br><span class="kw">DELETE FROM</span> copy_employees <span class="kw">WHERE</span> employee_id = <span class="num">300</span>;<br><br><span class="kw">ROLLBACK TO</span> sp2;           <span class="cm">-- Silme geri alındı, UPDATE kalır</span><br><span class="kw">ROLLBACK TO</span> sp1;           <span class="cm">-- UPDATE de geri alındı, INSERT kalır</span><br><span class="kw">COMMIT</span>;                    <span class="cm">-- Yalnızca INSERT kalıcı olur</span></div></div>
          <div class="card"><div class="card-title">Otomatik COMMIT Durumları</div>
          <ul>
            <li><span class="green">DDL komutları</span> (CREATE, DROP, ALTER) otomatik COMMIT üretir</li>
            <li>Veritabanı bağlantısı normal kapanırsa otomatik COMMIT</li>
            <li>Anormal kapanma veya sistem çökmesi otomatik <span class="red">ROLLBACK</span></li>
          </ul></div>
          <div class="card"><div class="card-title">SELECT ... FOR UPDATE</div>
          <p>Sorgu sonucundaki satırları <span class="highlight">kilitler</span>. Başka oturumlar bu satırları değiştiremez. COMMIT veya ROLLBACK ile kilit kalkar.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Departman 50'deki çalışanları kilitle</span><br><span class="kw">SELECT</span> employee_id, salary<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> department_id = <span class="num">50</span><br><span class="kw">FOR UPDATE</span>;<br><span class="cm">-- Güncelleyip kilidi kaldır</span><br><span class="kw">UPDATE</span> employees <span class="kw">SET</span> salary = salary * <span class="num">1.1</span> <span class="kw">WHERE</span> department_id = <span class="num">50</span>;<br><span class="kw">COMMIT</span>;</div></div>`

        content: `
          <div class="section-title">MERGE ve Çoklu Tablo Eklemeleri</div>
          <div class="section-sub">MERGE, eşleşen kayıtları günceller, eşleşmeyenleri ekler. Çoklu tablo eklemeleri aynı veriyi birden fazla tabloya dağıtır.</div>
          <div class="card"><div class="card-title">MERGE Komutu</div>
          <p>Kayıt <span class="green">varsa günceller</span>, <span class="highlight">yoksa ekler</span>. Tek sorguda hem INSERT hem UPDATE yapılır.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">MERGE INTO</span> copy_emp c             <span class="cm">-- hedef tablo</span><br><span class="kw">USING</span> employees e               <span class="cm">-- kaynak tablo</span><br><span class="kw">ON</span> (c.employee_id = e.employee_id) <span class="cm">-- eşleşme koşulu</span><br><span class="kw">WHEN MATCHED THEN</span><br>  <span class="kw">UPDATE SET</span><br>    c.salary = e.salary,<br>    c.job_id = e.job_id<br><span class="kw">WHEN NOT MATCHED THEN</span><br>  <span class="kw">INSERT</span> (employee_id, last_name, salary)<br>  <span class="kw">VALUES</span> (e.employee_id, e.last_name, e.salary);</div></div>
          <div class="card"><div class="card-title">DEFAULT Değer Kullanımı</div>
          <p>Sütunlara INSERT veya UPDATE sırasında varsayılan değer atanabilir. Tablo tanımındaki DEFAULT değeri kullanılır.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Tablo tanımında DEFAULT tanımlama</span><br><span class="kw">CREATE TABLE</span> departments (<br>  dept_id    <span class="fn">NUMBER</span>(<span class="num">5</span>) <span class="kw">PRIMARY KEY</span>,<br>  manager_id <span class="fn">NUMBER</span>(<span class="num">5</span>) <span class="kw">DEFAULT</span> <span class="num">100</span><br>);<br><br><span class="cm">-- INSERT\'te DEFAULT anahtar kelimesiyle kullanım</span><br><span class="kw">INSERT INTO</span> departments (dept_id, manager_id)<br><span class="kw">VALUES</span> (<span class="num">50</span>, <span class="kw">DEFAULT</span>);  <span class="cm">-- manager_id = 100 olur</span><br><br><span class="cm">-- UPDATE\'te DEFAULT kullanımı</span><br><span class="kw">UPDATE</span> departments<br><span class="kw">SET</span> manager_id = <span class="kw">DEFAULT</span><br><span class="kw">WHERE</span> dept_id = <span class="num">50</span>;</div></div>
          <div class="card"><div class="card-title">Şarsız Çoklu Tablo Ekleme (INSERT ALL)</div>
          <p>Alt sorgudan dönen tüm satırlar komutta belirtilen <span class="green">tüm tablolara</span> eklenir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Aynı veriyi iki farklı tabloya ekle</span><br><span class="kw">INSERT ALL</span><br>  <span class="kw">INTO</span> emp_archive (employee_id, last_name, salary)<br>    <span class="kw">VALUES</span> (employee_id, last_name, salary)<br>  <span class="kw">INTO</span> emp_backup (employee_id, hire_date)<br>    <span class="kw">VALUES</span> (employee_id, hire_date)<br><span class="kw">SELECT</span> employee_id, last_name, salary, hire_date<br><span class="kw">FROM</span> employees<br><span class="kw">WHERE</span> department_id = <span class="num">50</span>;</div></div>
          <div class="card"><div class="card-title">Şartlı Çoklu Tablo Ekleme (INSERT ALL / FIRST)</div>
          <p><span class="green">ALL</span>: Koşuller bağımsız değerlendirilir, bir satır birden fazla tabloya gidebilir.<br><span class="highlight">FIRST</span>: İlk sağlanan koşul uygulanır, daha fazlası değerlendirilmez.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- INSERT FIRST: satır yalnızca ilk eşleşen tabloya gider</span><br><span class="kw">INSERT FIRST</span><br>  <span class="kw">WHEN</span> salary > <span class="num">10000</span> <span class="kw">THEN</span><br>    <span class="kw">INTO</span> high_sal_emp <span class="kw">VALUES</span> (employee_id, salary)<br>  <span class="kw">WHEN</span> salary > <span class="num">5000</span>  <span class="kw">THEN</span><br>    <span class="kw">INTO</span> mid_sal_emp  <span class="kw">VALUES</span> (employee_id, salary)<br>  <span class="kw">ELSE</span><br>    <span class="kw">INTO</span> low_sal_emp  <span class="kw">VALUES</span> (employee_id, salary)<br><span class="kw">SELECT</span> employee_id, salary <span class="kw">FROM</span> employees;<br><br><span class="cm">-- INSERT ALL: koşullar bağımsız, bir satır birden fazla tabloya gidebilir</span><br><span class="kw">INSERT ALL</span><br>  <span class="kw">WHEN</span> salary > <span class="num">5000</span> <span class="kw">THEN INTO</span> sal_over_5k <span class="kw">VALUES</span>(employee_id, salary)<br>  <span class="kw">WHEN</span> hire_date > <span class="str">'01-JAN-2020'</span> <span class="kw">THEN INTO</span> new_hires <span class="kw">VALUES</span>(employee_id, hire_date)<br><span class="kw">SELECT</span> employee_id, salary, hire_date <span class="kw">FROM</span> employees;</div></div>`
      },

          <div class="section-sub">DDL (Veri Tanımlama Dili) komutları veritabanı nesnelerini oluşturur, değiştirir ve siler. DDL komutları otomatik COMMIT üretir.</div>

          <tr><td><span class="green">CREATE</span></td><td>Nesne oluşturur</td></tr>
          <tr><td><span class="highlight">ALTER</span></td><td>Nesneyi değiştirir</td></tr>
          <tr><td><span class="red">DROP</span></td><td>Nesneyi siler</td></tr>

          <div class="card"><div class="card-title">CREATE TABLE Sözdizimi</div>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Temel tablo oluşturma</span><br><span class="kw">CREATE TABLE</span> employees (<br>  employee_id  <span class="fn">NUMBER</span>(<span class="num">6</span>)     <span class="kw">NOT NULL</span>,<br>  first_name   <span class="fn">VARCHAR2</span>(<span class="num">20</span>),<br>  last_name    <span class="fn">VARCHAR2</span>(<span class="num">25</span>)  <span class="kw">NOT NULL</span>,<br>  hire_date    <span class="fn">DATE</span>          <span class="kw">DEFAULT SYSDATE</span>,<br>  salary       <span class="fn">NUMBER</span>(<span class="num">8</span>,<span class="num">2</span>),<br>  department_id <span class="fn">NUMBER</span>(<span class="num">4</span>)<br>);<br><br><span class="cm">-- Alt sorgu ile tablo oluşturma (veri + yapı kopyalanır)</span><br><span class="kw">CREATE TABLE</span> emp_copy<br><span class="kw">AS SELECT</span> employee_id, last_name, salary<br>   <span class="kw">FROM</span> employees<br>   <span class="kw">WHERE</span> department_id = <span class="num">50</span>;<br><br><span class="cm">-- Yalnızca yapı kopyala (veri yok)</span><br><span class="kw">CREATE TABLE</span> emp_empty<br><span class="kw">AS SELECT</span> * <span class="kw">FROM</span> employees <span class="kw">WHERE</span> <span class="num">1</span>=<span class="num">2</span>;</div></div>
          <div class="card"><div class="card-title">Tablo Adlandırma Kuralları</div>

            <li>1–30 karakter uzunluğunda olmalıdır</li>
            <li>A-Z, 0-9, _ (altçizgi), $ ve # karakterleri kullanılabilir</li>
            <li>Aynı kullanıcı içinde tekrar eden isim olamaz</li>
            <li>Oracle anahtar kelimeleri kullanılamaz</li>
            <li>Büyük/küçük harf duyarsızdır: EMPLOYEES = employees</li>
          </ul></div>
          <div class="card"><div class="card-title">ALTER TABLE — Tablo Değiştirme</div>
          <table><tr><th>Komut</th><th>Açıklama</th><th>Not</th></tr>

          <tr><td><span class="red">DROP COLUMN</span></td><td>Sütun siler</td><td>Geri alınamaz; en az 1 sütun kalmalı</td></tr>

          <div class="card"><div class="card-title">ALTER TABLE Örnekleri</div>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Yeni sütun ekle</span><br><span class="kw">ALTER TABLE</span> employees <span class="kw">ADD</span> (email <span class="fn">VARCHAR2</span>(<span class="num">50</span>));<br><br><span class="cm">-- Sütun boyutunu artır</span><br><span class="kw">ALTER TABLE</span> employees <span class="kw">MODIFY</span> (last_name <span class="fn">VARCHAR2</span>(<span class="num">50</span>));<br><br><span class="cm">-- Sütun sil (geri alınamaz!)</span><br><span class="kw">ALTER TABLE</span> employees <span class="kw">DROP COLUMN</span> email;<br><br><span class="cm">-- Sütunu işaretleyip sonra toplu sil</span><br><span class="kw">ALTER TABLE</span> employees <span class="kw">SET UNUSED</span> (phone_number);<br><span class="kw">ALTER TABLE</span> employees <span class="kw">DROP UNUSED COLUMNS</span>;</div></div>`

          <div class="section-sub">Tablo silme, yeniden adlandırma ve veri temizleme komutları. Yanlışlıkla silinen tablolar Oracle Recycle Bin aracılığıyla kurtarulabilir.</div>
          <div class="card"><div class="card-title">DROP TABLE</div>
          <p>Tabloyu ve içindeki tüm verileri <span class="red">kalıcı olarak kaldırır</span>. Tabloya ait indeksler de silinir.</p>

          <div class="card"><div class="card-title">FLASHBACK TABLE — Silinen Tabloyu Geri Getir</div>
          <p>Oracle silinen tabloyu geçici olarak <span class="green">Recycle Bin</span>'e taşır. FLASHBACK ile geri alınabilir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Recycle Bin'deki nesneleri listele</span><br><span class="kw">SELECT</span> * <span class="kw">FROM</span> USER_RECYCLEBIN;<br><br><span class="cm">-- Silinen tabloyu geri getir</span><br><span class="kw">FLASHBACK TABLE</span> employees <span class="kw">TO BEFORE DROP</span>;<br><br><span class="cm">-- Geri alınmadan kalıcı sil (Recycle Bin'i atla)</span><br><span class="kw">DROP TABLE</span> emp_copy <span class="kw">PURGE</span>;</div></div>
          <div class="card"><div class="card-title">RENAME — Tablo Adını Değiştir</div>

          <div class="section-title">Veri Sözlüğü (Data Dictionary)</div>
          <div class="section-sub">Veri sözlüğü, veritabanındaki tüm nesnelerin meta bilgilerini içeren sistem tablolarıdır. SYS kullanıcısına aittir; kullanıcılar yalnızca SELECT yapabilir.</div>
          <div class="card"><div class="card-title">Yaygın Veri Sözlüğü Görünümleri</div>
          <table><tr><th>Görünüm</th><th>Açıklama</th></tr>
          <tr><td><span class="green">USER_TABLES</span></td><td>Kullanıcının sahip olduğu tablolar</td></tr>
          <tr><td><span class="green">USER_OBJECTS</span></td><td>Kullanıcının tüm veritabanı nesneleri</td></tr>
          <tr><td><span class="highlight">USER_COLUMNS</span></td><td>Tablolardaki sütun bilgileri</td></tr>
          <tr><td><span class="highlight">USER_INDEXES</span></td><td>Kullanıcının indeksleri</td></tr>
          <tr><td><span class="accent">USER_CONSTRAINTS</span></td><td>Kısıt bilgileri</td></tr>
          <tr><td><span class="accent">USER_TAB_COMMENTS</span></td><td>Tablo yorumları</td></tr>
          <tr><td><span class="accent">DICTIONARY</span></td><td>Tüm veri sözlüğü görünümlerini listeler</td></tr></table></div>
          <div class="card"><div class="card-title">Veri Sözlüğü Sorguları</div>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Kendi tablolarımı listele</span><br><span class="kw">SELECT</span> table_name <span class="kw">FROM</span> USER_TABLES;<br><br><span class="cm">-- employees tablosunun sütunlarını incele</span><br><span class="kw">SELECT</span> column_name, data_type, data_length, nullable<br><span class="kw">FROM</span> USER_COLUMNS<br><span class="kw">WHERE</span> table_name = <span class="str">'EMPLOYEES'</span>;<br><br><span class="cm">-- Tüm nesnelerim</span><br><span class="kw">SELECT</span> object_name, object_type, status<br><span class="kw">FROM</span> USER_OBJECTS<br><span class="kw">ORDER BY</span> object_type;<br><br><span class="cm">-- Tüm veri sözlüğü görünümlerini listele</span><br><span class="kw">SELECT</span> * <span class="kw">FROM</span> DICTIONARY<br><span class="kw">WHERE</span> table_name <span class="kw">LIKE</span> <span class="str">'USER%'</span>;</div></div>
          <div class="card"><div class="card-title">Oracle Nesne Yapısı</div>
          <table><tr><th>Nesne Türü</th><th>Fiziksel Depolama</th></tr>
          <tr><td>Tablo, İndeks</td><td class="green">Evet — fiziksel disk alanı kullanır</td></tr>
          <tr><td>Constraint, View, Sequence, Synonym</td><td class="accent">Hayır — yalnızca tanım bilgisi</td></tr></table></div>
          <div class="card"><div class="card-title">Flashback Query — Geçmiş Veri Sürümleri</div>
          <p>Oracle, veri değişmeden önceki kopyaları <span class="highlight">UNDO</span> alanında saklar. VERSIONS ifadesi ile geçmiş sürümler sorgulanabilir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Bir satırın tüm geçmiş sürümlerini görüntüle</span><br><span class="kw">SELECT</span> versions_operation, versions_starttime, versions_endtime, salary<br><span class="kw">FROM</span> employees<br><span class="kw">VERSIONS BETWEEN SCN MINVALUE AND MAXVALUE</span><br><span class="kw">WHERE</span> employee_id = <span class="num">100</span>;<br><br><span class="cm">-- versions_operation değerleri:</span><br><span class="cm">-- I = INSERT  |  U = UPDATE  |  D = DELETE</span></div>
          <p style="margin-top:8px;font-size:.82rem;color:var(--muted)"><strong>SCN (System Change Number)</strong>: Oracle\'un işlemleri sıralamak için ürettuğu benzersiz, sürekli artan sayıdır.</p></div></div>
          <div class="card"><div class="card-title">Harici Tablolar</div>
          <p>Veriler veritabanı dışında (CSV, TXT gibi dosyalarda) tutulurken üzerinde SQL sorgusu çalıştırılabilir. Archi ve Büyük veri senaryolarında kullanılır. Yalnızca <span class="red">SELECT</span> yapılabilir, veri değiştirilemez.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">CREATE TABLE</span> emp_load (<br>  employee_id <span class="fn">NUMBER</span>(<span class="num">6</span>),<br>  first_name  <span class="fn">VARCHAR2</span>(<span class="num">20</span>)<br>)<br><span class="kw">ORGANIZATION EXTERNAL</span> (<br>  <span class="kw">TYPE</span> ORACLE_LOADER<br>  <span class="kw">DEFAULT DIRECTORY</span> def_dir1<br>  <span class="kw">ACCESS PARAMETERS</span> (<br>    RECORDS DELIMITED <span class="kw">BY</span> NEWLINE<br>    FIELDS<br>  )<br>  <span class="kw">LOCATION</span> (<span class="str">'info.dat'</span>)<br>);</div></div>`

        content: `
          <div class="section-title">Kısıtlamalar (Constraints) <span class="badge badge-yellow">Lab 10</span></div>
          <div class="section-sub">Kısıtlamalar, tablolara girilen verilerin belirli kurallara uymasını zorunlu kılar. Hatalı veri girişlerini önler ve veri güvenilirliğini artırır.</div>
          <div class="card"><div class="card-title">Kısıtlama Türleri</div>
          <table><tr><th>Kısıt</th><th>Görevi</th><th>Örnek</th></tr>
          <tr><td><span class="red">NOT NULL</span></td><td>Boş veri engeller</td><td>last_name NULL olamaz</td></tr>
          <tr><td><span class="highlight">UNIQUE</span></td><td>Tekrarı engeller</td><td>email benzersiz</td></tr>
          <tr><td><span class="green">PRIMARY KEY</span></td><td>Kimlik alanı (NN + UQ)</td><td>employee_id</td></tr>
          <tr><td><span class="accent">FOREIGN KEY</span></td><td>Tablo ilişkisi</td><td>department_id → departments</td></tr>
          <tr><td><span class="accent">CHECK</span></td><td>Kurallı veri</td><td>salary > 0</td></tr></table></div>
          <div class="card"><div class="card-title">Kısıtı Nerede Tanımlarız?</div>
          <ul>
            <li><span class="green">Sütun Seviyesi</span>: Kısıt tek sütuna uygulanır, sütunun yanında yazılır</li>
            <li><span class="highlight">Tablo Seviyesi</span>: Birden fazla sütun birlikte kontrol edilir, tablonun sonunda yazılır</li>
            <li><span class="red">NOT NULL</span> yalnızca sütun seviyesinde tanımlanabilir</li>
          </ul></div>
          <div class="card"><div class="card-title">Kısıt İsimlendirme</div>
          <p>Kısıt adı verilmezse Oracle <span class="red">SYS_C00585417</span> gibi anlamsız bir isim üretir. Önerilen format: <span class="green">tablo_sutun_kisit</span></p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Önerilen isimlendirme</span><br>clients_email_uk       <span class="cm">-- uk = Unique</span><br>clients_last_name_nn   <span class="cm">-- nn = Not Null</span><br>clients_client_pk      <span class="cm">-- pk = Primary Key</span><br>orders_client_fk       <span class="cm">-- fk = Foreign Key</span></div></div>
          <div class="card"><div class="card-title">NOT NULL Kısıtlaması</div>
          <p>Bir sütunun boş bırakılmasını engeller. Yalnızca sütun seviyesinde tanımlanır.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="kw">CREATE TABLE</span> employees (<br>  employee_id <span class="fn">NUMBER</span>(<span class="num">6</span>),<br>  last_name   <span class="fn">VARCHAR2</span>(<span class="num">25</span>) <span class="kw">CONSTRAINT</span> emp_last_nn <span class="kw">NOT NULL</span>,<br>  email       <span class="fn">VARCHAR2</span>(<span class="num">50</span>) <span class="kw">NOT NULL</span><br>);<br><span class="cm">-- NOT NULL ihlali: hata verir</span><br><span class="kw">INSERT INTO</span> employees <span class="kw">VALUES</span>(<span class="num">1</span>, <span class="kw">NULL</span>, <span class="str">'a@b.com'</span>); <span class="cm">-- ❌</span></div></div>
          <div class="card"><div class="card-title">UNIQUE Kısıtlaması</div>
          <p>Sütundaki değerlerin tekrar etmesini engeller. <span class="green">NULL değerler birbirine eşit sayılmaz</span>, bu nedenle birden fazla NULL olabilir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Tek sütun UNIQUE</span><br><span class="kw">CREATE TABLE</span> clients (<br>  email <span class="fn">VARCHAR2</span>(<span class="num">50</span>) <span class="kw">CONSTRAINT</span> clients_email_uk <span class="kw">UNIQUE</span><br>);<br><br><span class="cm">-- Bileşik UNIQUE: ad+soyad birlikte benzersiz</span><br><span class="kw">CREATE TABLE</span> persons (<br>  first_name <span class="fn">VARCHAR2</span>(<span class="num">25</span>),<br>  last_name  <span class="fn">VARCHAR2</span>(<span class="num">25</span>),<br>  <span class="kw">CONSTRAINT</span> persons_name_uk <span class="kw">UNIQUE</span>(first_name, last_name)<br>);</div></div>
          <div class="card"><div class="card-title">PRIMARY KEY Kısıtlaması</div>
          <p>Her satırı benzersiz olarak tanımlar. <span class="red">NULL olamaz + Tekrar edemez</span>. Bir tabloda yalnızca <span class="red">1 adet</span> PRIMARY KEY olabilir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Tek sütun PRIMARY KEY</span><br><span class="kw">CREATE TABLE</span> clients (<br>  client_number <span class="fn">NUMBER</span>(<span class="num">5</span>) <span class="kw">CONSTRAINT</span> clients_client_pk <span class="kw">PRIMARY KEY</span>,<br>  last_name     <span class="fn">VARCHAR2</span>(<span class="num">25</span>)<br>);<br><br><span class="cm">-- Bileşik PRIMARY KEY (tablo seviyesi zorunlu)</span><br><span class="kw">CREATE TABLE</span> enrollments (<br>  student_id <span class="fn">NUMBER</span>(<span class="num">6</span>),<br>  course_id  <span class="fn">VARCHAR2</span>(<span class="num">10</span>),<br>  <span class="kw">CONSTRAINT</span> enr_pk <span class="kw">PRIMARY KEY</span>(student_id, course_id)<br>);<br><span class="cm">-- student_id=101, course_id='VT101' birlikte benzersiz</span></div></div>`
      },

          <div class="section-title">FOREIGN KEY ve CHECK Kısıtlamaları</div>
          <div class="section-sub">FOREIGN KEY tablolar arası ilişkiyi zorunlu kılar; CHECK ise sütuna girilecek veriler için özel kurallar tanımlar.</div>
          <div class="card"><div class="card-title">FOREIGN KEY Kısıtlaması</div>
          <p>Bir tablodaki sütunun başka bir tablonun PRIMARY KEY alanına bağlanmasını sağlar. FK içeren tabloya <span class="highlight">'çocuk tablo'</span>, referans aldığı tabloya <span class="green">'ana tablo'</span> denir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Sütun seviyesinde FOREIGN KEY</span><br><span class="kw">CREATE TABLE</span> employees (<br>  employee_id   <span class="fn">NUMBER</span>(<span class="num">6</span>) <span class="kw">PRIMARY KEY</span>,<br>  department_id <span class="fn">NUMBER</span>(<span class="num">4</span>) <span class="kw">CONSTRAINT</span> emp_dept_fk<br>                  <span class="kw">REFERENCES</span> departments(department_id)<br>);<br><br><span class="cm">-- Tablo seviyesinde FOREIGN KEY</span><br><span class="kw">CREATE TABLE</span> employees (<br>  employee_id   <span class="fn">NUMBER</span>(<span class="num">6</span>),<br>  department_id <span class="fn">NUMBER</span>(<span class="num">4</span>),<br>  <span class="kw">CONSTRAINT</span> emp_dept_fk<br>    <span class="kw">FOREIGN KEY</span>(department_id)<br>    <span class="kw">REFERENCES</span> departments(department_id)<br>);</div></div>
          <div class="card"><div class="card-title">ON DELETE CASCADE</div>
          <p>Ana tablodaki bir kayıt silinince, o kayıta bağlı çocuk tablo kayıtları da <span class="red">otomatik silinir</span>. Yetim kayıt oluşmasını engeller.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Sütun seviyesinde ON DELETE CASCADE</span><br><span class="kw">CREATE TABLE</span> songs (<br>  song_id   <span class="fn">NUMBER</span>(<span class="num">5</span>) <span class="kw">CONSTRAINT</span> songs_cd_fk<br>              <span class="kw">REFERENCES</span> cds(cd_id) <span class="kw">ON DELETE CASCADE</span>,<br>  title     <span class="fn">VARCHAR2</span>(<span class="num">50</span>)<br>);<br><span class="cm">-- cds tablosundan bir cd silinirse, o cd'ye ait</span><br><span class="cm">-- tüm songs satırları otomatik silinir</span><br><br><span class="cm">-- ON DELETE CASCADE olmadan:</span><br><span class="cm">-- FK var olduğu sürece ana tablo satırı silinemez → hata!</span></div></div>
          <div class="card"><div class="card-title">CHECK Kısıtlaması</div>
          <p>Bir sütuna girilecek veriler için <span class="highlight">boolean koşul</span> tanımlar. Koşulu sağlamayan veri reddedilir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Sütun seviyesinde CHECK</span><br><span class="kw">CREATE TABLE</span> employees (<br>  salary <span class="fn">NUMBER</span>(<span class="num">8</span>,<span class="num">2</span>) <span class="kw">CONSTRAINT</span> emp_sal_ck <span class="kw">CHECK</span>(salary > <span class="num">0</span>),<br>  age    <span class="fn">NUMBER</span>(<span class="num">3</span>)   <span class="kw">CONSTRAINT</span> emp_age_ck <span class="kw">CHECK</span>(age >= <span class="num">18</span>)<br>);<br><br><span class="cm">-- Tablo seviyesinde çoklu CHECK</span><br><span class="kw">CREATE TABLE</span> cds (<br>  cd_number <span class="fn">NUMBER</span>(<span class="num">5</span>),<br>  year      <span class="fn">NUMBER</span>(<span class="num">4</span>),<br>  producer  <span class="fn">VARCHAR2</span>(<span class="num">20</span>),<br>  <span class="kw">CONSTRAINT</span> cds_num_ck   <span class="kw">CHECK</span>(cd_number <span class="kw">BETWEEN</span> <span class="num">10</span> <span class="kw">AND</span> <span class="num">999</span>),<br>  <span class="kw">CONSTRAINT</span> cds_year_ck  <span class="kw">CHECK</span>(year > <span class="num">1996</span>),<br>  <span class="kw">CONSTRAINT</span> cds_prod_ck  <span class="kw">CHECK</span>(producer <span class="kw">IN</span> (<span class="str">'Sony'</span>, <span class="str">'EMI'</span>, <span class="str">'WB'</span>))<br>);</div></div>
          <div class="card"><div class="card-title">FK — Ana ve Çocuk Tablo Kuralı</div>
          <table><tr><th>Durum</th><th>ON DELETE CASCADE</th><th>ON DELETE CASCADE olmadan</th></tr>
          <tr><td>Ana satır silinirse</td><td class="green">Çocuk satırlar da silinir</td><td class="red">Hata! Silme engellenir</td></tr>
          <tr><td>FK olmayan değer eklenmek istenir</td><td class="red">Hata! Değer reddedilir</td><td class="red">Hata! Değer reddedilir</td></tr></table></div>`
      },
      {
        type: 'practice',
        title: 'FOREIGN KEY / CHECK Alıştırması',
        questions: [
          { q: 'songs tablosuna cd_id sütununu cds tablosunun cd_id PRIMARY KEY\'ine bağlayan ve ana kayıt silinince otomatik silinen FOREIGN KEY yazın.', answer: ['references cds(cd_id) on delete cascade', 'foreign key(cd_id) references cds(cd_id) on delete cascade'], hint: 'REFERENCES cds(cd_id) ON DELETE CASCADE', template: 'CREATE TABLE songs (\n  song_id NUMBER(5),\n  cd_id NUMBER(5) CONSTRAINT songs_cd_fk [BURAYA],\n  title VARCHAR2(50)\n);' },

          <div class="section-title">Kısıt Yönetimi</div>
          <div class="section-sub">Mevcut tablolara kısıt eklenebilir, kaldırılabilir veya geçici olarak devre dışı bırakılabilir. Kısıt türü sonradan değiştirilmek istenirse: önce kaldır, sonra yenisini ekle.</div>
          <div class="card"><div class="card-title">ALTER TABLE ile Kısıt Ekleme</div>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- PRIMARY KEY ekle</span><br><span class="kw">ALTER TABLE</span> clients<br>  <span class="kw">ADD CONSTRAINT</span> clients_client_pk <span class="kw">PRIMARY KEY</span>(client_number);<br><br><span class="cm">-- FOREIGN KEY ekle</span><br><span class="kw">ALTER TABLE</span> employees<br>  <span class="kw">ADD CONSTRAINT</span> emp_dept_fk<br>  <span class="kw">FOREIGN KEY</span>(department_id)<br>  <span class="kw">REFERENCES</span> departments(department_id);<br><br><span class="cm">-- CHECK ekle</span><br><span class="kw">ALTER TABLE</span> staffs<br>  <span class="kw">ADD CONSTRAINT</span> staffs_sal_ck <span class="kw">CHECK</span>(salary > <span class="num">0</span>);<br><br><span class="cm">-- NOT NULL sonradan ekle (MODIFY kullanılır!)</span><br><span class="kw">ALTER TABLE</span> employees<br>  <span class="kw">MODIFY</span>(salary <span class="fn">NUMBER</span>(<span class="num">8</span>,<span class="num">2</span>) <span class="kw">NOT NULL</span>);</div></div>
          <div class="card"><div class="card-title">ALTER TABLE ile Kısıt Kaldırma</div>
          <p>Kısıtı kaldırmak için tablo adı ve <span class="red">kısıt adı</span> gereklidir.</p>
          <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Kopyala</button><span class="cm">-- Kısıt kaldır</span><br><span class="kw">ALTER TABLE</span> clients<br>  <span class="kw">DROP CONSTRAINT</span> clients_client_pk;<br><br><span class="cm">-- Kısıt adını öğren (veri sözlüğünden)</span><br><span class="kw">SELECT</span> constraint_name, constraint_type<br><span class="kw">FROM</span> USER_CONSTRAINTS<br><span class="kw">WHERE</span> table_name = <span class="str">'CLIENTS'</span>;<br><br><span class="cm">-- Bağlı FK'larla birlikte kaldır</span><br><span class="kw">ALTER TABLE</span> departments<br>  <span class="kw">DROP CONSTRAINT</span> dept_pk <span class="kw">CASCADE</span>;<br><span class="cm">-- dept_pk silinir + ona bağlı tüm FK'lar da silinir</span><br><br><span class="cm">-- Sütun silinirken bağlı kısıtları da kaldır</span><br><span class="kw">ALTER TABLE</span> employees<br>  <span class="kw">DROP COLUMN</span> department_id <span class="kw">CASCADE CONSTRAINTS</span>;</div></div>
